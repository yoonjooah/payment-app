<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>시재</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:760px;margin:auto;padding:48px 24px 80px}h1{font-size:48px;margin:20px 0 55px}.card{background:#fff;color:#090909;border-radius:42px;padding:32px;margin-bottom:38px}h2{font-size:39px;margin:0 0 32px}.label{font-size:26px;font-weight:700;margin:18px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}input{width:100%;height:82px;border:3px solid #ddd;border-radius:28px;font-size:28px;padding:0 28px;outline:none}input::placeholder{color:#aaa}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}.actions button{height:78px;border:0;border-radius:26px;font-size:28px;font-weight:800}.plus{background:#000;color:#fff}.minus{background:#eee;color:#111}.divider{border-top:4px solid #111;margin:30px 0 22px}.total{display:flex;justify-content:space-between;align-items:center;font-size:34px;font-weight:800}.rows{margin-top:28px}.head,.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 50px;gap:6px;align-items:center;text-align:center;padding:12px 0;border-bottom:1px solid #e5e5e5}.head{font-weight:800}.row{font-size:17px}.del{border:0;background:#eee;border-radius:10px;height:34px}.empty{text-align:center;color:#999;padding:32px 0}.note{color:#777;font-size:16px;margin-top:12px}@media(max-width:520px){main{padding:34px 14px 60px}h1{font-size:40px;margin-bottom:45px}.card{padding:26px 18px;border-radius:34px}h2{font-size:34px}.label{font-size:22px}input{height:72px;font-size:23px;padding:0 20px}.actions button{font-size:23px}.total{font-size:29px}.head,.row{font-size:14px;grid-template-columns:1fr 1fr 1fr 1fr 38px}}</style></head><body><main><h1>시재</h1>
<section class="card"><h2>가게</h2><div class="label">가게 금액</div><input id="shop" inputmode="numeric" placeholder="예: 30000"><div class="actions"><button class="plus" onclick="addShop(1)">+ 추가</button><button class="minus" onclick="addShop(-1)">− 마이너스</button></div><div class="divider"></div><div class="total"><span>가게 합계</span><span id="shopTotal">0원</span></div><div id="shopRows" class="rows"></div></section>
<section class="card"><h2>건수 / 인센</h2><div class="grid"><div><div class="label">건수 금액</div><input id="count" inputmode="numeric" placeholder="예: 130000"></div><div><div class="label">인센 현금</div><input id="cash" inputmode="numeric" placeholder="예: 100000"></div><div><div class="label">인센 이체</div><input id="transfer" inputmode="numeric" placeholder="예: 50000"></div><div></div></div><div class="actions"><button class="plus" onclick="addIncentive(1)">+ 추가</button><button class="minus" onclick="addIncentive(-1)">− 마이너스</button></div><div class="rows"><div class="head"><span>건수</span><span>현금</span><span>이체</span><span>가게</span><span></span></div><div id="incRows"></div></div><div class="divider"></div><div class="total"><span>건수 합계</span><span id="countTotal">0원</span></div><div class="total" style="margin-top:12px"><span>인센 합계</span><span id="incTotal">0원</span></div></section>
</main><script>const KEY='sijae_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"shop":[],"inc":[]}');const n=id=>{let v=(document.getElementById(id).value||'').replace(/[^0-9-]/g,'');return Math.abs(parseInt(v)||0)},won=x=>x.toLocaleString('ko-KR')+'원';function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function addShop(sign){let v=n('shop');if(!v)return;data.shop.push(sign*v);document.getElementById('shop').value='';save()}function addIncentive(sign){let a=n('count'),b=n('cash'),c=n('transfer');if(!a&&!b&&!c)return;data.inc.push({count:sign*a,cash:sign*b,transfer:sign*c});['count','cash','transfer'].forEach(x=>document.getElementById(x).value='');save()}function delShop(i){data.shop.splice(i,1);save()}function delInc(i){data.inc.splice(i,1);save()}function render(){let st=data.shop.reduce((a,b)=>a+b,0),ct=data.inc.reduce((a,b)=>a+b.count,0),it=data.inc.reduce((a,b)=>a+b.cash+b.transfer,0);shopTotal.textContent=won(st);countTotal.textContent=won(ct);incTotal.textContent=won(it);shopRows.innerHTML=data.shop.length?data.shop.map((v,i)=>`<div class="row" style="grid-template-columns:1fr 50px;text-align:left"><span>${v<0?'− ':'+ '}${won(Math.abs(v))}</span><button class="del" onclick="delShop(${i})">×</button></div>`).join(''):'<div class="empty">금액을 추가해 주세요.</div>';incRows.innerHTML=data.inc.length?data.inc.map((r,i)=>`<div class="row"><span>${r.count.toLocaleString()}</span><span>${r.cash.toLocaleString()}</span><span>${r.transfer.toLocaleString()}</span><span>${st.toLocaleString()}</span><button class="del" onclick="delInc(${i})">×</button></div>`).join(''):'<div class="empty">금액을 추가해 주세요.</div>'}render();</script></body></html>
