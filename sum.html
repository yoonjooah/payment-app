<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>현금 합산</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:#111}.wrap{max-width:430px;margin:auto;padding:18px 14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 14px #00000010}h1{font-size:21px;margin:0 0 17px}.row{display:grid;grid-template-columns:82px 1fr;gap:10px;align-items:center;margin:12px 0}.label{font-weight:700;font-size:15px}.inputbox{display:grid;grid-template-columns:1fr 112px;gap:8px;align-items:center}input{width:100%;height:43px;border:1px solid #ddd;border-radius:11px;padding:0 11px;font-size:18px;text-align:right;background:#fafafa}.amount{text-align:right;font-size:14px;font-weight:700;white-space:nowrap}.total{margin-top:17px;padding-top:16px;border-top:1px solid #eee;display:flex;justify-content:space-between;align-items:center;font-weight:800}.total strong{font-size:23px}button{margin-top:16px;width:100%;height:42px;border:0;border-radius:11px;background:#111;color:#fff;font-weight:700;font-size:15px}.hint{font-size:12px;color:#777;margin-top:10px;text-align:center}</style></head><body><div class="wrap"><div class="card"><h1>💵 현금 합산</h1><div class="row"><div class="label">5만원권</div><div class="inputbox"><input id="n50" type="number" inputmode="numeric" step="1" placeholder="장수"><div class="amount" id="a50">0원</div></div></div><div class="row"><div class="label">1만원권</div><div class="inputbox"><input id="n10" type="number" inputmode="numeric" step="1" placeholder="장수"><div class="amount" id="a10">0원</div></div></div><div class="total"><span>총 합계</span><strong id="total">0원</strong></div><button id="reset">전체 초기화</button><div class="hint">마이너스 장수도 입력할 수 있어요. 입력값은 자동 저장됩니다.</div></div></div><script>const n50=document.getElementById('n50'),n10=document.getElementById('n10');const fmt=n=>n.toLocaleString('ko-KR')+'원';function calc(){const x=Number(n50.value||0),y=Number(n10.value||0);document.getElementById('a50').textContent=fmt(x*50000);document.getElementById('a10').textContent=fmt(y*10000);document.getElementById('total').textContent=fmt(x*50000+y*10000);localStorage.setItem('cash_n50',n50.value);localStorage.setItem('cash_n10',n10.value)}n50.value=localStorage.getItem('cash_n50')||'';n10.value=localStorage.getItem('cash_n10')||'';n50.addEventListener('input',calc);n10.addEventListener('input',calc);document.getElementById('reset').onclick=()=>{n50.value='';n10.value='';calc()};calc();</script></body></html>
