<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>시재 관리</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding:28px 18px 50px}
h1{font-size:30px;margin:5px 0 22px}
.card{background:#fff;color:#111;border-radius:22px;padding:20px;margin-bottom:18px}
.title{font-size:23px;font-weight:800;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:750;margin-bottom:7px}
input{width:100%;height:52px;border:1.5px solid #ddd;border-radius:14px;padding:0 14px;font-size:19px;background:#fff;color:#111}
button{border:0;border-radius:14px;background:#000;color:#fff;font-size:17px;font-weight:800;padding:15px 18px}
.add{width:100%;margin-top:14px}
table{width:100%;border-collapse:collapse;margin-top:18px}
th,td{padding:13px 8px;border-bottom:1px solid #e7e7e7;text-align:right;font-size:17px}
th:first-child,td:first-child{text-align:left}
.del{padding:8px 11px;font-size:14px}
.total{display:flex;justify-content:space-between;align-items:center;font-size:22px;font-weight:900;margin-top:16px;padding-top:16px;border-top:2px solid #111}
.grand{font-size:26px}
.empty{text-align:center!important;color:#888;padding:25px}
@media(max-width:500px){.app{padding:22px 12px 40px}.card{padding:17px 14px}.grid{gap:8px}th,td{font-size:15px;padding:11px 5px}}
</style>
</head>
<body>
<div class="app">
<h1>시재</h1>

<div class="card">
  <div class="title">건수</div>
  <div class="grid">
    <div><label>건수 금액</label><input id="countAmount" inputmode="numeric" placeholder="예: 130000"></div>
    <div><label>인센</label><input id="incentive" inputmode="numeric" placeholder="예: 150000"></div>
  </div>
  <button class="add" id="addRow">+ 추가</button>

  <table>
    <thead><tr><th>건수</th><th>인센</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="total"><span>건수 합계</span><span id="countTotal">0원</span></div>
  <div class="total"><span>인센 합계</span><span id="incentiveTotal">0원</span></div>
  <div class="total grand"><span>일한금액</span><span id="grandTotal">0원</span></div>
</div>
</div>

<script>
const KEY='sijae_black_v1';
let rows=JSON.parse(localStorage.getItem(KEY)||'[]');
const $=id=>document.getElementById(id);
const num=v=>Number(String(v||'').replace(/[^0-9-]/g,''))||0;
const won=n=>Number(n||0).toLocaleString('ko-KR')+'원';

function save(){localStorage.setItem(KEY,JSON.stringify(rows))}
function render(){
 const body=$('rows'); body.innerHTML='';
 let a=0,b=0;
 rows.forEach((r,i)=>{
   a+=r.a; b+=r.b;
   const tr=document.createElement('tr');
   tr.innerHTML=`<td>${r.a.toLocaleString('ko-KR')}</td><td>${r.b.toLocaleString('ko-KR')}</td><td><button class="del" data-i="${i}">삭제</button></td>`;
   body.appendChild(tr);
 });
 if(!rows.length) body.innerHTML='<tr><td colspan="3" class="empty">금액을 추가해 주세요.</td></tr>';
 $('countTotal').textContent=won(a);
 $('incentiveTotal').textContent=won(b);
 $('grandTotal').textContent=won(a+b);
 document.querySelectorAll('.del').forEach(btn=>btn.onclick=()=>{
   rows.splice(Number(btn.dataset.i),1); save(); render();
 });
}
$('addRow').onclick=()=>{
 const a=num($('countAmount').value), b=num($('incentive').value);
 if(!a&&!b){alert('금액을 입력해 주세요.');return}
 rows.push({a,b}); save(); render();
 $('countAmount').value=''; $('incentive').value='';
};
render();
</script>
</body>
</html>
