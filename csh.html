<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>시재</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{max-width:760px;margin:auto;padding:48px 24px 80px}h1{font-size:48px;margin:20px 0 55px}.card{background:#fff;color:#090909;border-radius:42px;padding:32px;margin-bottom:38px}h2{font-size:39px;margin:0 0 32px}.label{font-size:26px;font-weight:700;margin:18px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}input{width:100%;height:82px;border:3px solid #ddd;border-radius:28px;font-size:28px;padding:0 28px;outline:none}input::placeholder{color:#aaa}.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}.actions button{height:78px;border:0;border-radius:26px;font-size:28px;font-weight:800}.plus{background:#000;color:#fff}.minus{background:#eee;color:#111}.divider{border-top:4px solid #111;margin:30px 0 22px}.total{display:flex;justify-content:space-between;align-items:center;font-size:34px;font-weight:800}.rows{margin-top:28px}.head,.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 50px;gap:6px;align-items:center;text-align:center;padding:12px 0;border-bottom:1px solid #e5e5e5}.head{font-weight:800}.row{font-size:17px}.del{border:0;background:#eee;border-radius:10px;height:34px}.empty{text-align:center;color:#999;padding:32px 0}.note{color:#777;font-size:16px;margin-top:12px}@media(max-width:520px){main{padding:34px 14px 60px}h1{font-size:40px;margin-bottom:45px}.card{padding:26px 18px;border-radius:34px}h2{font-size:34px}.label{font-size:22px}input{height:72px;font-size:23px;padding:0 20px}.actions button{font-size:23px}.total{font-size:29px}.head,.row{font-size:14px;grid-template-columns:1fr 1fr 1fr 1fr 38px}}
/* compact iPhone layout */
main{max-width:680px;padding:28px 16px 55px}h1{font-size:36px;margin:14px 0 34px}.card{border-radius:30px;padding:22px;margin-bottom:26px}h2{font-size:30px;margin:0 0 22px}.label{font-size:20px;margin:12px 0 8px}.grid{gap:12px}input{height:62px;border-width:2px;border-radius:20px;font-size:21px;padding:0 18px}.actions{gap:10px;margin-top:18px}.actions button{height:58px;border-radius:19px;font-size:20px}.divider{border-top-width:3px;margin:22px 0 16px}.total{font-size:25px}.rows{margin-top:20px}.head,.row{padding:9px 0}.row{font-size:14px}.empty{padding:24px 0;font-size:14px}.note{font-size:13px}
@media(max-width:520px){main{padding:24px 12px 45px}h1{font-size:32px;margin-bottom:30px}.card{padding:20px 15px;border-radius:28px;margin-bottom:24px}h2{font-size:28px;margin-bottom:18px}.label{font-size:18px}input{height:58px;font-size:19px;padding:0 16px}.actions button{height:56px;font-size:19px}.total{font-size:23px}.head,.row{font-size:12px;grid-template-columns:1fr 1fr 1fr 1fr 1fr 34px}.del{height:30px}}
</style></head><body><main><h1>시재</h1>
<section class="card"><h2>가게</h2><div class="grid"><div><div class="label">가게 현금</div><input id="shopCash" inputmode="numeric" placeholder="예: 30000"></div><div><div class="label">가게 이체</div><input id="shopTransfer" inputmode="numeric" placeholder="예: 30000"></div></div><div class="actions"><button class="plus" onclick="addShop(1)">+ 추가</button><button class="minus" onclick="addShop(-1)">− 마이너스</button></div><div class="divider"></div><div class="total"><span>가게 합계</span><span id="shopTotal">0원</span></div><div id="shopRows" class="rows"></div></section>
<section class="card"><h2>건수 / 인센</h2><div class="grid"><div><div class="label">건수 현금</div><input id="countCash" inputmode="numeric" placeholder="예: 130000"></div><div><div class="label">건수 이체</div><input id="countTransfer" inputmode="numeric" placeholder="예: 50000"></div><div><div class="label">인센 현금</div><input id="cash" inputmode="numeric" placeholder="예: 100000"></div><div><div class="label">인센 이체</div><input id="transfer" inputmode="numeric" placeholder="예: 50000"></div></div><div class="actions"><button class="plus" onclick="addIncentive(1)">+ 추가</button><button class="minus" onclick="addIncentive(-1)">− 마이너스</button></div><div class="divider"></div><div class="total"><span>건수 합계</span><span id="countTotal">0원</span></div><div class="total" style="margin-top:12px"><span>인센 합계</span><span id="incentiveTotal">0원</span></div><div class="divider"></div><div class="total"><span>건수 현금 합산</span><span id="countCashTotal">0원</span></div><div class="total" style="margin-top:12px"><span>건수 이체 합산</span><span id="countTransferTotal">0원</span></div><div class="total" style="margin-top:12px"><span>인센 현금 합산</span><span id="incentiveCashTotal">0원</span></div><div class="total" style="margin-top:12px"><span>인센 이체 합산</span><span id="incentiveTransferTotal">0원</span></div><div class="divider"></div><div class="total"><span>현금 합산</span><span id="cashCombinedTotal">0원</span></div><div class="total" style="margin-top:12px"><span>이체 합산</span><span id="transferCombinedTotal">0원</span></div><div class="divider"></div><div class="total"><span>현금·이체 총합계</span><span id="cashTransferGrandTotal">0원</span></div><div class="rows"><div class="head"><span>건수 현금</span><span>건수 이체</span><span>인센 현금</span><span>인센 이체</span><span></span></div><div id="incRows"></div></div></section>
<section class="card"><h2>받아야 할 금액</h2><div class="grid"><div><div class="label">현금</div><input id="recvCash" inputmode="numeric" placeholder="예: 30000"></div><div><div class="label">이체</div><input id="recvTransfer" inputmode="numeric" placeholder="예: 30000"></div></div><div class="actions"><button class="plus" onclick="addReceivable(1)">+ 추가</button><button class="minus" onclick="addReceivable(-1)">− 마이너스</button></div><div id="recvRows" class="rows"></div><div class="divider"></div><div class="total"><span>현금 합계</span><span id="recvCashTotal">0원</span></div><div class="total" style="margin-top:12px"><span>이체 합계</span><span id="recvTransferTotal">0원</span></div><div class="total" style="margin-top:12px"><span>받아야 할 금액 합계</span><span id="recvTotal">0원</span></div></section>
</main><script>const KEY='sijae_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"shop":[],"inc":[],"recv":[]}');data.recv=data.recv||[];const n=id=>{let v=(document.getElementById(id).value||'').replace(/[^0-9-]/g,'');return Math.abs(parseInt(v)||0)},won=x=>x.toLocaleString('ko-KR')+'원';function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function addShop(sign){let c=n('shopCash'),t=n('shopTransfer');if(!c&&!t)return;data.shop.push({cash:sign*c,transfer:sign*t});['shopCash','shopTransfer'].forEach(x=>document.getElementById(x).value='');save()}function addReceivable(sign){let c=n('recvCash'),t=n('recvTransfer');if(!c&&!t)return;data.recv.push({cash:sign*c,transfer:sign*t});['recvCash','recvTransfer'].forEach(x=>document.getElementById(x).value='');save()}function delRecv(i){data.recv.splice(i,1);save()}function addIncentive(sign){let a=n('countCash'),b=n('countTransfer'),c=n('cash'),d=n('transfer');if(!a&&!b&&!c&&!d)return;data.inc.push({countCash:sign*a,countTransfer:sign*b,cash:sign*c,transfer:sign*d});['countCash','countTransfer','cash','transfer'].forEach(x=>document.getElementById(x).value='');save()}function delShop(i){data.shop.splice(i,1);save()}function delInc(i){data.inc.splice(i,1);save()}function render(){let st=data.shop.reduce((a,b)=>a+(typeof b==='number'?b:(b.cash||0)+(b.transfer||0)),0),rc=data.recv.reduce((a,b)=>a+(b.cash||0),0),rt=data.recv.reduce((a,b)=>a+(b.transfer||0),0),cc=data.inc.reduce((a,b)=>a+(b.countCash!=null?b.countCash:(b.count||0)),0),ct=data.inc.reduce((a,b)=>a+(b.countTransfer||0),0),ic=data.inc.reduce((a,b)=>a+(b.cash||0),0),it=data.inc.reduce((a,b)=>a+(b.transfer||0),0);shopTotal.textContent=won(st);countTotal.textContent=won(cc+ct);incentiveTotal.textContent=won(ic+it);cashTransferGrandTotal.textContent=won(cc+ct+ic+it);countCashTotal.textContent=won(cc);countTransferTotal.textContent=won(ct);incentiveCashTotal.textContent=won(ic);incentiveTransferTotal.textContent=won(it);cashCombinedTotal.textContent=won(cc+ic);transferCombinedTotal.textContent=won(ct+it);recvCashTotal.textContent=won(rc);recvTransferTotal.textContent=won(rt);recvTotal.textContent=won(rc+rt);recvRows.innerHTML=data.recv.length?data.recv.map((r,i)=>`<div class="row" style="grid-template-columns:1fr 1fr 50px"><span>현금 ${r.cash<0?'− ':'+ '}${won(Math.abs(r.cash||0))}</span><span>이체 ${r.transfer<0?'− ':'+ '}${won(Math.abs(r.transfer||0))}</span><button class="del" onclick="delRecv(${i})">×</button></div>`).join(''):'<div class="empty">금액을 추가해 주세요.</div>';shopRows.innerHTML=data.shop.length?data.shop.map((v,i)=>{let c=typeof v==='number'?v:(v.cash||0),t=typeof v==='number'?0:(v.transfer||0);return `<div class="row" style="grid-template-columns:1fr 1fr 50px;text-align:center"><span>현금 ${c<0?'− ':'+ '}${won(Math.abs(c))}</span><span>이체 ${t<0?'− ':'+ '}${won(Math.abs(t))}</span><button class="del" onclick="delShop(${i})">×</button></div>`}).join(''):'<div class="empty">금액을 추가해 주세요.</div>';incRows.innerHTML=data.inc.length?data.inc.map((r,i)=>`<div class="row"><span>${(r.countCash!=null?r.countCash:(r.count||0)).toLocaleString()}</span><span>${(r.countTransfer||0).toLocaleString()}</span><span>${(r.cash||0).toLocaleString()}</span><span>${(r.transfer||0).toLocaleString()}</span><button class="del" onclick="delInc(${i})">×</button></div>`).join(''):'<div class="empty">금액을 추가해 주세요.</div>'}render();</script></body></html>
