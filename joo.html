<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>금액 관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#080808;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{max-width:760px;margin:auto;padding:22px 10px 40px}h1{color:#fff;font-size:28px;margin:0 3px 17px;font-weight:900}.card{background:#fff;border-radius:23px;padding:16px 13px;margin-bottom:14px}h2{font-size:20px;margin:0 0 14px;font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:14px;font-weight:800;margin-bottom:5px}input{width:100%;height:49px;border:2px solid #ddd;border-radius:15px;background:#fff;padding:0 12px;font-size:17px;outline:none}.add{width:100%;height:50px;margin-top:12px;border:0;border-radius:15px;background:#111;color:#fff;font-size:18px;font-weight:900}.record{padding:12px 0;border-bottom:1px solid #ddd}.record:last-child{border-bottom:0}.date{font-size:13px;font-weight:900;color:#666;margin-bottom:6px}.amounts{display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:900}.del{margin-top:8px;border:0;border-radius:9px;padding:6px 10px;background:#eee;font-weight:800}.empty{color:#777;font-size:14px;text-align:center;padding:8px}.totalrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:17px;font-weight:900}.totalrow b{font-size:20px;white-space:nowrap}.grand{border-top:2px solid #111;margin-top:8px;padding-top:13px}.grand b{font-size:23px}.reset{width:100%;height:48px;margin-top:14px;border:0;border-radius:15px;background:#eee;color:#111;font-size:16px;font-weight:900}
</style></head><body><div class="app"><h1>금액 관리</h1>
<section class="card"><h2>오늘 금액 추가</h2><div class="two"><div><label>현금</label><input id="cash" inputmode="numeric" placeholder="0"></div><div><label>이체</label><input id="transfer" inputmode="numeric" placeholder="0"></div></div><button class="add" id="addBtn">추가</button></section>
<section class="card"><h2>날짜별 기록</h2><div id="records"></div></section>
<section class="card"><h2>누적 합산</h2><div class="totalrow"><span>현금 합계</span><b id="cashTotal">0원</b></div><div class="totalrow"><span>이체 합계</span><b id="transferTotal">0원</b></div><div class="totalrow grand"><span>전체 합계</span><b id="grandTotal">0원</b></div><button class="reset" id="resetBtn">전체 초기화</button></section>
<section class="card"><h2>미수금</h2><div class="two"><div><label>날짜</label><input id="unpaidDate" type="date"></div><div><label>미수금</label><input id="unpaidAmount" inputmode="numeric" placeholder="0"></div></div><button class="add" id="unpaidAddBtn">미수금 추가</button><div id="unpaidRecords" style="margin-top:12px"></div><div class="totalrow grand"><span>미수금 합계</span><b id="unpaidTotal">0원</b></div></section>
</div><script>
const KEY='amount_manager_daily_v1';const UNPAID_KEY='amount_manager_unpaid_v1';const $=id=>document.getElementById(id);const num=v=>Number(String(v||'').replace(/[^0-9-]/g,''))||0;const won=n=>n.toLocaleString('ko-KR')+'원';let rows=[];let unpaidRows=[];try{rows=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){rows=[]}try{unpaidRows=JSON.parse(localStorage.getItem(UNPAID_KEY)||'[]')}catch(e){unpaidRows=[]}
function save(){localStorage.setItem(KEY,JSON.stringify(rows))}function dateText(){const d=new Date();return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function render(){const box=$('records');box.innerHTML='';if(!rows.length)box.innerHTML='<div class="empty">아직 추가한 기록이 없어요.</div>';[...rows].reverse().forEach((r,rev)=>{const i=rows.length-1-rev;const el=document.createElement('div');el.className='record';el.innerHTML=`<div class="date">${r.date}</div><div class="amounts"><span>현금 ${won(r.cash)}</span><span>이체 ${won(r.transfer)}</span></div><button class="del" data-i="${i}">삭제</button>`;box.appendChild(el)});document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{rows.splice(Number(b.dataset.i),1);save();render()});const c=rows.reduce((a,r)=>a+r.cash,0),t=rows.reduce((a,r)=>a+r.transfer,0);$('cashTotal').textContent=won(c);$('transferTotal').textContent=won(t);$('grandTotal').textContent=won(c+t)}
function saveUnpaid(){localStorage.setItem(UNPAID_KEY,JSON.stringify(unpaidRows))}function renderUnpaid(){const box=$('unpaidRecords');box.innerHTML='';if(!unpaidRows.length)box.innerHTML='<div class="empty">아직 미수금 기록이 없어요.</div>';[...unpaidRows].reverse().forEach((r,rev)=>{const i=unpaidRows.length-1-rev;const el=document.createElement('div');el.className='record';el.innerHTML=`<div class="date">${r.date}</div><div class="amounts"><span>미수금</span><span>${won(r.amount)}</span></div><button class="del unpaid-del" data-i="${i}">삭제</button>`;box.appendChild(el)});document.querySelectorAll('.unpaid-del').forEach(b=>b.onclick=()=>{unpaidRows.splice(Number(b.dataset.i),1);saveUnpaid();renderUnpaid()});$('unpaidTotal').textContent=won(unpaidRows.reduce((a,r)=>a+r.amount,0))}function todayInput(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}$('unpaidDate').value=todayInput();$('unpaidAddBtn').onclick=()=>{const date=$('unpaidDate').value,amount=num($('unpaidAmount').value);if(!date||amount===0)return;unpaidRows.push({date,amount});saveUnpaid();$('unpaidAmount').value='';renderUnpaid()};$('addBtn').onclick=()=>{const cash=num($('cash').value),transfer=num($('transfer').value);if(cash===0&&transfer===0)return;rows.push({date:dateText(),cash,transfer});save();$('cash').value='';$('transfer').value='';render()};$('resetBtn').onclick=()=>{if(!confirm('날짜별 기록과 누적 합계를 모두 초기화할까요?'))return;rows=[];localStorage.removeItem(KEY);$('cash').value='';$('transfer').value='';render()};render();renderUnpaid();
</script></body></html>
