<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>고객명단</title>
<style>
:root{--bg:#f6f6f8;--card:#fff;--text:#17171a;--muted:#777;--line:#e8e8ec;--accent:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text)}
.wrap{max-width:760px;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
h1{font-size:28px;margin:0 0 12px}.search{margin-bottom:12px}.search input{font-size:17px;border:2px solid #ddd}.add{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 12px #0000000a;margin-bottom:14px}
.addrow{display:grid;grid-template-columns:110px 1fr auto;gap:8px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;font-size:16px;outline:none}textarea{resize:none;min-height:46px}
button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700}.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border-radius:18px;padding:13px;box-shadow:0 2px 12px #0000000a}.top{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:9px}.num{font-weight:800;font-size:18px}.visit{display:flex;align-items:center;gap:7px}.visit button{width:36px;height:36px;padding:0;border-radius:10px}.countInput{width:70px!important;padding:8px!important;text-align:center;font-weight:800;border-radius:10px!important}.del{background:#eee;color:#555;width:36px;height:36px;padding:0}.memo{margin-top:10px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.hint{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:520px){.addrow{grid-template-columns:92px 1fr}.addrow button{grid-column:1/-1}.top{grid-template-columns:72px 1fr auto}.visit{justify-content:flex-start}.visit button{width:34px}.count{min-width:42px}}
</style></head><body><main class="wrap"><h1>고객명단</h1><div class="search"><input id="search" inputmode="numeric" maxlength="4" placeholder="🔎 뒷번호 검색"></div>
<section class="add"><div class="addrow"><input id="phone" inputmode="numeric" maxlength="4" placeholder="뒷번호"><input id="memo" placeholder="기타메모"><button id="addBtn">고객 추가</button></div><div class="hint">뒷번호 · 방문횟수 · 기타메모가 이 기기에 자동 저장됩니다.</div></section>
<div id="list" class="list"></div></main>
<script>
const KEY='customer-list-v1'; let data=[]; try{data=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const list=document.getElementById('list'), phone=document.getElementById('phone'), memo=document.getElementById('memo'), search=document.getElementById('search');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){let q=search.value.replace(/\D/g,'');let rows=data.map((x,i)=>({...x,i})).filter(x=>!q||String(x.phone).includes(q));if(!rows.length){list.innerHTML='<div class="empty">'+(q?'찾는 번호가 없어요.':'등록된 고객이 없어요.')+'</div>';return} list.innerHTML=rows.map(x=>`<section class="item"><div class="top"><div class="num">${esc(x.phone)}</div><div class="visit"><button onclick="chg(${x.i},-1)">−</button><input class="countInput" type="number" min="0" inputmode="numeric" value="${x.count||0}" onchange="setCount(${x.i},this.value)"><button onclick="chg(${x.i},1)">+</button></div><button class="del" onclick="del(${x.i})">×</button></div><div class="memo"><textarea placeholder="기타메모" oninput="setMemo(${x.i},this.value)">${esc(x.memo)}</textarea></div></section>`).join('')}
function add(){let p=phone.value.replace(/\D/g,'').slice(-4);if(!p){phone.focus();return}data.unshift({phone:p,count:0,memo:memo.value.trim()});save();render();phone.value='';memo.value='';phone.focus()}
window.chg=(i,n)=>{data[i].count=Math.max(0,(Number(data[i].count)||0)+n);save();render()};window.setCount=(i,v)=>{data[i].count=Math.max(0,parseInt(v)||0);save();render()};window.del=i=>{if(confirm('이 고객을 삭제할까요?')){data.splice(i,1);save();render()}};window.setMemo=(i,v)=>{data[i].memo=v;save()};
document.getElementById('addBtn').onclick=add; search.addEventListener('input',render); phone.addEventListener('keydown',e=>{if(e.key==='Enter')add()});render();
</script></body></html>
