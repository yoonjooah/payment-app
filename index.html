<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>♡ 우리 강아지 가계부 ♡</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#fff;font-family:Arial,"Malgun Gothic",sans-serif;color:#514248}
.app{max-width:980px;margin:auto;background:#fff;min-height:100vh}
.header{display:flex;align-items:center;gap:18px;padding:18px 22px;border-bottom:1px solid #eee}
.dog{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid #f0dfe4}
.title{font-size:28px;font-weight:800}.sub{color:#999;margin-top:5px}
.tabs{display:flex;gap:8px;padding:14px 20px;background:#fff}
.tab{border:1px solid #eadfe3;background:#fff;border-radius:20px;padding:10px 25px;font-weight:700;color:#8c747b;cursor:pointer}
.tab.active{background:#f7e9ed;color:#59434b;border-color:#ead0d8}
.page{display:none;padding:0 20px 25px}.page.active{display:block}
.card{border:1px solid #eee4e7;border-radius:18px;padding:18px;background:#fff;margin-bottom:14px;box-shadow:0 3px 14px #00000008}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label{font-size:13px;font-weight:700;color:#725c63}
input,select{border:1px solid #ddd0d5;border-radius:10px;padding:11px;font-size:15px;background:#fff;color:#514248}
button{border:0;border-radius:11px;padding:11px 16px;background:#f3e5e9;color:#604951;font-weight:700;cursor:pointer}
button.main{background:#efd9e0}.danger{color:#c55a70;background:#fff0f3}
.money{font-size:25px;font-weight:800}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{padding:11px 8px;border-bottom:1px solid #f0eaec;text-align:left}th{background:#faf6f7;color:#705960;font-size:13px}td.num{text-align:right}
.remain{font-weight:800}.negative{color:#c94e68}.positive{color:#6d8f77}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.acct{padding:17px;border-radius:16px;border:1px solid #eee4e7}.acct:nth-child(1){background:#fff9ed}.acct:nth-child(2){background:#fff5f8}.acct:nth-child(3){background:#f4f8ff}
.acct h3{margin:0 0 8px}.small{font-size:12px;color:#888;margin-top:6px}
.notice{font-size:12px;color:#999;margin-top:8px}
@media(max-width:650px){.cards{grid-template-columns:1fr}.dog{width:70px;height:70px}.title{font-size:21px}table{font-size:13px}.header{padding:14px}.page{padding:0 12px 20px}}
</style>

<div class="acct"><h3>금고</h3><div class="money" id="cashbox">0원</div><div class="small" id="cashboxSub"></div></div>
<div class="acct"><h3>현금</h3><div class="money" id="cash">0원</div><div class="small" id="cashSub"></div></div>
<div class="acct"><h3>계좌</h3><div class="money" id="bank">0원</div><div class="small" id="bankSub"></div></div>
</div>
<div class="card">
<h3>가계부 내역</h3>
<div class="row">
<input id="ldate" type="date">
<input id="lcontent" placeholder="내용" style="flex:1;min-width:130px">
<select id="laccount"><option>금고</option><option selected>현금</option><option>계좌</option></select>
<select id="ltype"><option>수입</option><option selected>지출</option></select>
<input id="lplace" placeholder="사용처">
<input id="lamount" type="number" placeholder="금액" min="0">
<button class="main" onclick="addLedger()">＋ 내역 추가</button>
</div>
<table><thead><tr><th>날짜</th><th>내용</th><th>구분</th><th>수입/지출</th><th>사용처</th><th class="num">금액</th><th></th></tr></thead>
<tbody id="ltbody"></tbody></table>
</div>
</section>
</div>

<script>
const KEY="myDogBudgetV1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"saved":2000000,"paid":0,"monthly":[],"ledger":[]}');
const won=n=>Number(n||0).toLocaleString("ko-KR")+"원";
function persist(){localStorage.setItem(KEY,JSON.stringify(data));}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function saveSaved(){data.saved=Number(document.getElementById('saved').value||0);data.paid=Number(document.getElementById('paid').value||0);persist();renderMonthly()}
function addMonthly(){let n=document.getElementById('mname').value.trim(),a=Number(document.getElementById('mamount').value||0);if(!n||a<0){alert('지출 이름과 금액을 입력해주세요.');return}data.monthly.push({name:n,amount:a});document.getElementById('mname').value='';document.getElementById('mamount').value='';persist();renderMonthly()}
function delMonthly(i){data.monthly.splice(i,1);persist();renderMonthly()}
function renderMonthly(){document.getElementById('saved').value=data.saved;document.getElementById('paid').value=data.paid||0;let rem=data.saved-(data.paid||0),total=0,body='';data.monthly.forEach((x,i)=>{total+=x.amount;rem-=x.amount;body+=`<tr><td>${esc(x.name)}</td><td class="num">${won(x.amount)}</td><td class="num remain ${rem<0?'negative':''}">${won(rem)}</td><td><button class="danger" onclick="delMonthly(${i})">삭제</button></td></tr>`});document.getElementById('mtbody').innerHTML=body||'<tr><td colspan="4" style="text-align:center;color:#aaa">아직 지출이 없어요.</td></tr>';document.getElementById('mtotal').textContent=won((data.paid||0)+total);document.getElementById('mremain').textContent=won(rem);document.getElementById('mremain').className=rem<0?'negative':''}
function addLedger(){let x={date:document.getElementById('ldate').value,content:document.getElementById('lcontent').value.trim(),account:document.getElementById('laccount').value,type:document.getElementById('ltype').value,place:document.getElementById('lplace').value.trim(),amount:Number(document.getElementById('lamount').value||0)};if(!x.content||x.amount<0){alert('내용과 금액을 입력해주세요.');return}data.ledger.push(x);document.getElementById('lcontent').value='';document.getElementById('lplace').value='';document.getElementById('lamount').value='';persist();renderLedger()}
function delLedger(i){data.ledger.splice(i,1);persist();renderLedger()}
function renderLedger(){let st={금고:[0,0],현금:[0,0],계좌:[0,0]},body='';data.ledger.forEach((x,i)=>{if(st[x.account])st[x.account][x.type==='수입'?0:1]+=x.amount;body+=`<tr><td>${esc(x.date)}</td><td>${esc(x.content)}</td><td>${x.account}</td><td>${x.type}</td><td>${esc(x.place)}</td><td class="num">${x.type==='지출'?'-':''}${won(x.amount)}</td><td><button class="danger" onclick="delLedger(${i})">삭제</button></td></tr>`});document.getElementById('ltbody').innerHTML=body||'<tr><td colspan="7" style="text-align:center;color:#aaa">아직 내역이 없어요.</td></tr>';[['금고','cashbox','cashboxSub'],['현금','cash','cashSub'],['계좌','bank','bankSub']].forEach(([a,id,sub])=>{let inc=st[a][0],out=st[a][1];document.getElementById(id).textContent=won(inc-out);document.getElementById(sub).textContent=`수입 ${won(inc)}  |  지출 ${won(out)}`})}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('ldate').value=new Date().toISOString().slice(0,10);
renderMonthly();renderLedger();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body>
</html>
