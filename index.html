<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16853d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="납부정리">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>납부금액정리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;background:#fff;padding-bottom:30px}
header{background:#16853d;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 18px;position:sticky;top:0;z-index:5}
h1{margin:0 0 14px;font-size:23px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#fff;color:#202124;border-radius:12px;padding:11px 9px}.card small{display:block;color:#777;font-size:11px}.card b{display:block;margin-top:4px;font-size:16px}
main{padding:14px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:9px;padding:10px 12px;font-weight:700}.primary{background:#16853d;color:#fff}.secondary{background:#edf1ee}.danger{background:#fff0f0;color:#c62828}
.table-wrap{overflow:auto;border:1px solid #ddd;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:690px}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:right}th{background:#f7f8f7;font-size:12px;color:#666}th:first-child,td:first-child{text-align:left}
input{width:100%;padding:8px;border:1px solid #ddd;border-radius:7px;font-size:14px}input.num{text-align:right}
tfoot td{font-weight:800;background:#fafafa}.remaining{color:#16853d}.install{background:#eef8f1;border-radius:12px;padding:12px;margin-bottom:12px;font-size:13px;line-height:1.5}
@media(max-width:520px){.summary{gap:5px}.card b{font-size:14px}.toolbar button{flex:1}}
</style>
</head>
<body>
<div class="app">
<header><h1>납부금액정리</h1><div class="summary">
<div class="card"><small>총 예정액</small><b id="total">0원</b></div>
<div class="card"><small>납부 완료</small><b id="paid">0원</b></div>
<div class="card"><small>남은 금액</small><b class="remaining" id="remain">0원</b></div>
</div></header>
<main>
<div class="install"><b>📱 아이폰 앱으로 쓰기</b><br>Safari에서 이 페이지를 연 뒤 <b>공유 → 홈 화면에 추가</b>를 누르면 앱 아이콘으로 사용할 수 있어요.</div>
<div class="toolbar">
<button class="primary" onclick="addRow()">＋ 항목 추가</button><button class="secondary" onclick="save()">저장</button>
<button class="secondary" onclick="load()">불러오기</button><button class="danger" onclick="resetAll()">초기화</button>
</div>
<div class="table-wrap"><table><thead><tr><th>내야할 것</th><th>날짜</th><th>금액</th><th>낸금액</th><th>모아둔금액</th><th></th></tr></thead>
<tbody id="rows"></tbody><tfoot><tr><td colspan="2">합계</td><td id="sd">0원</td><td id="sp">0원</td><td id="ss">0원</td><td></td></tr></tfoot></table></div>
</main></div>
<script>
const initial=[["대출","30일",500000,500000,3150000],["카드","26일",400000,0,0],["폰/인터넷","13일",400000,0,0],["삼남매","말일",50000,50000,0],["월세","26일",750000,750000,0],["관리비","",60000,60000,0],["공과금","",150000,0,0],["모임통장","",30000,30000,0]];
const w=n=>Number(n||0).toLocaleString("ko-KR")+"원";
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function addRow(a=["","",0,0,0]){let t=document.createElement("tr");t.innerHTML=`<td><input value="${esc(a[0])}" oninput="calc()"></td><td><input value="${esc(a[1])}" oninput="calc()"></td><td><input class=num type=number value="${a[2]||0}" oninput="calc()"></td><td><input class=num type=number value="${a[3]||0}" oninput="calc()"></td><td><input class=num type=number value="${a[4]||0}" oninput="calc()"></td><td><button class=danger onclick="this.closest('tr').remove();calc()">삭제</button></td>`;rows.appendChild(t);calc()}
function data(){return [...rows.rows].map(r=>{let i=r.querySelectorAll("input");return[i[0].value,i[1].value,+i[2].value||0,+i[3].value||0,+i[4].value||0]})}
function calc(){let d=data(),a=d.reduce((x,r)=>x+r[2],0),b=d.reduce((x,r)=>x+r[3],0),c=d.reduce((x,r)=>x+r[4],0);total.textContent=w(a);paid.textContent=w(b);remain.textContent=w(Math.max(a-b,0));sd.textContent=w(a);sp.textContent=w(b);ss.textContent=w(c)}
function save(){localStorage.setItem("payapp",JSON.stringify(data()));alert("저장했어요.")}
function load(){let x=localStorage.getItem("payapp");if(!x)return alert("저장된 데이터가 없어요.");rows.innerHTML="";JSON.parse(x).forEach(addRow)}
function resetAll(){if(confirm("초기화할까요?")){localStorage.removeItem("payapp");rows.innerHTML="";initial.forEach(addRow)}}
initial.forEach(addRow);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>
