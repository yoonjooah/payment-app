<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>윤주아의 가계부</title>
<style>
  :root{
    --pink:#f8c9dc; --pink2:#ffe8f1; --pink3:#fff6fa;
    --text:#42383d; --muted:#8c7f86; --line:#f2dce5;
    --blue:#2688ef; --red:#ff4e4e; --green:#55b86a;
    --shadow:0 2px 10px rgba(150,110,125,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text)}
  .app{max-width:760px;margin:0 auto;min-height:100vh;padding:28px 20px 50px}
  header{text-align:center;padding:12px 0 18px}
  h1{font-size:30px;margin:0;font-weight:800;letter-spacing:-1.5px}
  .tabs{display:flex;gap:10px;margin:6px 0 14px}
  .tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:30px;padding:13px;font-size:16px;font-weight:700;color:#9c8e95}
  .tab.active{background:var(--pink2);border-color:#f5c4d9;color:#8f5b72}
  .card{border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;background:#fff;box-shadow:var(--shadow)}
  .label{font-size:15px;font-weight:800;margin-bottom:7px}
  input,select{width:100%;border:1px solid #ead8df;border-radius:10px;padding:12px 13px;font-size:16px;background:#fff;color:var(--text);outline:none}
  input:focus,select:focus{border-color:#edb9d0}
  .row{display:flex;gap:12px;align-items:end}
  .row>*{flex:1}
  button{border:0;border-radius:10px;padding:12px 15px;font-size:15px;font-weight:800;cursor:pointer}
  .pink-btn{background:var(--pink2);color:#9a6078}
  .blue-btn{background:#e9f4ff;color:var(--blue)}
  .green-btn{background:#eaf8ee;color:var(--green)}
  .danger{background:#fff0f4;color:#ed6f91}
  .small{padding:8px 10px;font-size:13px}
  .hint{font-size:13px;color:var(--muted);line-height:1.55;margin:12px 2px 0}
  .expense-form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
  .section-title{font-size:18px;font-weight:850;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--pink2);padding:10px 7px;text-align:center;font-weight:800}
  td{padding:11px 6px;border-bottom:1px solid #f2e7eb;text-align:center;white-space:nowrap}
  td:nth-child(3){font-weight:700}
  .controls{display:flex;justify-content:center;gap:6px;align-items:center}
  .edit-amount{width:105px;padding:8px 7px;font-size:13px;text-align:right}
  .totals{margin-top:15px;border-top:1px solid var(--line);padding-top:8px}
  .total-row{display:flex;justify-content:space-between;padding:9px 2px;font-weight:800}
  .remaining{font-size:22px;margin-top:3px}
  .remaining span{font-size:25px}
  .income{color:var(--blue)} .out{color:var(--red)}
  .account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .account{border:1px solid var(--line);border-radius:14px;padding:16px 12px}
  .account:nth-child(1){background:#fffaf0}.account:nth-child(2){background:#fff6fa}.account:nth-child(3){background:#f5faff}
  .account b{display:block;font-size:24px;margin:7px 0 5px}
  .account small{color:var(--muted)}
  .empty{text-align:center;color:#9b8f95;padding:18px}
  .hidden{display:none}
  .save-row{display:flex;gap:10px;align-items:end}
  .save-row .field{flex:1}
  @media(max-width:560px){
    .app{padding:18px 12px 35px}
    h1{font-size:26px}
    .expense-form{grid-template-columns:1fr 1fr}
    .expense-form button{grid-column:1/-1}
    table{font-size:12px}
    td,th{padding:9px 3px}
    .account-grid{gap:7px}
    .account{padding:13px 8px}
    .account b{font-size:21px}
    .controls{gap:3px}
    .small{padding:7px 7px;font-size:11px}
  }
</style>
</head>
<body>
<div class="app">
  <header><h1>윤주아의 가계부</h1></header>

  <div class="tabs">
    <button class="tab active" id="tabLedger">가계부</button>
    <button class="tab" id="tabMonthly">매달 지출</button>
  </div>

  <section id="ledgerView">
    <div class="account-grid">
      <div class="account"><span>금고 🔒</span><b id="vault">0원</b><small>수입 <span id="vaultIn">0원</span></small></div>
      <div class="account"><span>현금 👛</span><b id="cash">0원</b><small>수입 <span id="cashIn">0원</span></small></div>
      <div class="account"><span>계좌 🏦</span><b id="bank">0원</b><small>수입 <span id="bankIn">0원</span></small></div>
    </div>

    <div class="card">
      <div class="section-title">가계부 내역</div>
      <div class="row">
        <div><div class="label">날짜</div><input id="date" type="date"></div>
        <div><div class="label">내용</div><input id="desc" placeholder="내용"></div>
        <div><div class="label">구분</div><select id="type"><option value="income">수입</option><option value="expense">지출</option></select></div>
        <div><div class="label">금액</div><input id="amount" type="number" min="0" placeholder="금액"></div>
      </div>
      <div style="display:flex;justify-content:center;gap:10px;margin-top:14px">
        <button class="pink-btn" id="addLedger">추가하기</button>
        <button class="danger" id="resetLedger">초기화</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title">가계부 목록</div>
      <table>
        <thead><tr><th>날짜</th><th>내용</th><th>구분</th><th>금액</th><th>삭제</th></tr></thead>
        <tbody id="ledgerBody"><tr><td colspan="5" class="empty">내역이 없습니다.</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <div class="section-title">가계부 합계</div>
      <div class="totals">
        <div class="total-row"><span>총 수입</span><span class="income" id="totalIncome">0원</span></div>
        <div class="total-row"><span>총 지출</span><span class="out" id="totalExpense">0원</span></div>
        <div class="total-row"><span>총 합계</span><span id="balance">0원</span></div>
      </div>
    </div>
  </section>

  <section id="monthlyView" class="hidden">
    <div class="card">
      <div class="label">총 모아둔 금액</div>
      <input id="savedMoney" type="number" min="0" value="2700000">
      <div class="label" style="margin-top:16px">총 낸 금액</div>
      <div class="save-row">
        <div class="field"><input id="paidMoney" type="number" min="0" value="0"></div>
        <button class="pink-btn" id="savePaid">저장</button>
      </div>
      <div class="hint">총 모아둔 금액과 총 낸 금액은 직접 숫자로 입력해요.<br>아래 지출은 각각 따로 추가하고 남은 금액을 확인할 수 있어요.</div>
    </div>

    <div class="card">
      <div class="section-title">매달 지출</div>
      <div class="expense-form">
        <div><div class="label">지출 이름</div><input id="expenseName" placeholder="지출 이름"></div>
        <div><div class="label">금액</div><input id="expenseAmount" type="number" min="0" placeholder="금액"></div>
        <button class="pink-btn" id="addExpense">＋ 지출 추가</button>
      </div>
      <div style="overflow:auto;margin-top:14px">
        <table>
          <thead><tr><th>지출 이름</th><th>금액</th><th>지출 후 남은 금액</th><th>관리</th></tr></thead>
          <tbody id="expenseBody"></tbody>
        </table>
      </div>
      <div class="totals">
        <div class="total-row"><span>총 낸 금액</span><span id="monthlyTotal">0원</span></div>
        <div class="remaining">남은 금액 <span id="remaining">2,700,000원</span></div>
      </div>
    </div>
  </section>
</div>

<script>
const won = n => Number(n||0).toLocaleString('ko-KR')+'원';
const $ = id => document.getElementById(id);
const today = new Date().toISOString().slice(0,10);
$('date').value = today;

let ledger = JSON.parse(localStorage.getItem('ledger') || '[]');
let monthly = JSON.parse(localStorage.getItem('monthly') || '{"saved":2700000,"paid":0,"items":[]}');

function save(){ localStorage.setItem('ledger',JSON.stringify(ledger)); localStorage.setItem('monthly',JSON.stringify(monthly)); }

function renderLedger(){
  const body=$('ledgerBody');
  if(!ledger.length) body.innerHTML='<tr><td colspan="5" class="empty">내역이 없습니다.</td></tr>';
  else body.innerHTML=ledger.map((x,i)=>`<tr>
    <td>${x.date}</td><td>${escapeHtml(x.desc)}</td><td>${x.type==='income'?'수입':'지출'}</td>
    <td class="${x.type==='income'?'income':'out'}">${won(x.amount)}</td>
    <td><button class="danger small" onclick="delLedger(${i})">삭제</button></td>
  </tr>`).join('');
  const income=ledger.filter(x=>x.type==='income').reduce((s,x)=>s+Number(x.amount),0);
  const expense=ledger.filter(x=>x.type==='expense').reduce((s,x)=>s+Number(x.amount),0);
  $('totalIncome').textContent=won(income); $('totalExpense').textContent=won(expense); $('balance').textContent=won(income-expense);
  $('vault').textContent=won(0); $('cash').textContent=won(0); $('bank').textContent=won(income-expense);
  $('vaultIn').textContent=won(0); $('cashIn').textContent=won(0); $('bankIn').textContent=won(income);
}
function delLedger(i){ledger.splice(i,1);save();renderLedger();}
window.delLedger=delLedger;

function renderMonthly(){
  $('savedMoney').value=monthly.saved;
  $('paidMoney').value=monthly.paid;
  const body=$('expenseBody');
  let running=Number(monthly.saved)-Number(monthly.paid);
  body.innerHTML='';
  monthly.items.forEach((x,i)=>{
    running-=Number(x.amount);
    body.innerHTML += `<tr>
      <td>${escapeHtml(x.name)}</td><td>${won(x.amount)}</td><td>${won(running)}</td>
      <td><div class="controls">
        <input class="edit-amount" type="number" min="0" value="${Number(x.amount)}"
          onchange="setExpenseAmount(${i}, this.value)" aria-label="지출 금액 수정">
        <button class="pink-btn small" onclick="setExpenseFromPrompt(${i})">수정</button>
        <button class="danger small" onclick="delExpense(${i})">삭제</button>
      </div></td>
    </tr>`;
  });
  const total=monthly.items.reduce((s,x)=>s+Number(x.amount),0);
  $('monthlyTotal').textContent=won(total);
  $('remaining').textContent=won(Number(monthly.saved)-Number(monthly.paid)-total);
}
function setExpenseAmount(i,value){
  const amount=Math.max(0, Number(value)||0);
  monthly.items[i].amount=amount;
  save();
  renderMonthly();
}
function setExpenseFromPrompt(i){
  const current=Number(monthly.items[i].amount)||0;
  const value=prompt('지출 금액을 직접 입력해주세요.', current);
  if(value===null) return;
  const amount=Number(value);
  if(!Number.isFinite(amount)||amount<0){
    alert('0원 이상의 숫자를 입력해주세요.');
    return;
  }
  setExpenseAmount(i,amount);
}
function delExpense(i){ monthly.items.splice(i,1); save(); renderMonthly(); }
window.setExpenseAmount=setExpenseAmount;
window.setExpenseFromPrompt=setExpenseFromPrompt;
window.delExpense=delExpense;

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

$('addLedger').onclick=()=>{
  const amount=Number($('amount').value);
  if(!$('desc').value.trim()||!amount){alert('내용과 금액을 입력해주세요.');return;}
  ledger.push({date:$('date').value||today,desc:$('desc').value.trim(),type:$('type').value,amount});
  save();renderLedger();$('desc').value='';$('amount').value='';
};
$('resetLedger').onclick=()=>{if(confirm('가계부 내역을 모두 삭제할까요?')){ledger=[];save();renderLedger();}};
$('addExpense').onclick=()=>{
  const name=$('expenseName').value.trim(), amount=Number($('expenseAmount').value);
  if(!name||!amount){alert('지출 이름과 금액을 입력해주세요.');return;}
  monthly.items.push({name,amount});save();renderMonthly();$('expenseName').value='';$('expenseAmount').value='';
};
$('savePaid').onclick=()=>{monthly.saved=Number($('savedMoney').value)||0;monthly.paid=Number($('paidMoney').value)||0;save();renderMonthly();};

$('tabLedger').onclick=()=>{ $('tabLedger').classList.add('active');$('tabMonthly').classList.remove('active');$('ledgerView').classList.remove('hidden');$('monthlyView').classList.add('hidden'); };
$('tabMonthly').onclick=()=>{ $('tabMonthly').classList.add('active');$('tabLedger').classList.remove('active');$('monthlyView').classList.remove('hidden');$('ledgerView').classList.add('hidden'); };

renderLedger(); renderMonthly();
</script>
</body>
</html>
