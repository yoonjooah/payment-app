<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6e5ea">
<title>♡ 윤주아의 가계부 ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#58464e;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px 20px 60px}
header{display:flex;align-items:center;gap:18px;padding:10px 4px 24px;border-bottom:1px solid #eee2e6}
.dog{width:92px;height:92px;border-radius:50%;object-fit:cover;border:5px solid #f4dbe3;flex:none}
h1{font-size:32px;margin:0 0 5px;font-weight:800;letter-spacing:-1px}.sub{color:#aaa;font-size:17px}
.tabs{display:flex;gap:12px;margin:24px 0 22px}.tab{flex:1;padding:14px;border:2px solid #efd9e0;border-radius:32px;background:#fff;text-align:center;font-weight:800;font-size:19px;cursor:pointer}.tab.active{background:#f7e4ea}
.page{display:none}.page.active{display:block}
.card{background:#fff;border:2px solid #f0e1e6;border-radius:24px;padding:24px 28px;margin-bottom:22px;box-shadow:0 4px 16px rgba(234,221,225,.18)}
.balance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.balance{border:2px solid #eee1e5;border-radius:22px;padding:24px 22px;min-height:180px}.balance:nth-child(1){background:#fffaf0}.balance:nth-child(2){background:#fff4f7}.balance:nth-child(3){background:#f4f8ff}.balance h3{font-size:24px;margin:0 0 16px}.balance .money{font-size:38px;font-weight:800;margin-bottom:10px}.muted{color:#aaa;font-size:16px}
.card h2{font-size:26px;margin:0 0 20px}.form-grid{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:12px}.field label{display:block;font-weight:700;font-size:14px;margin:0 0 7px}.field input,.field select,input.inline{width:100%;padding:14px;border:2px solid #e5d5dc;border-radius:15px;font-size:17px;background:#fff;outline:none}.entry-row{display:grid;grid-template-columns:1fr 1.6fr 1fr 1fr;gap:12px;margin-top:12px}.btn{border:0;border-radius:14px;padding:13px 18px;background:#efd4de;color:#58464e;font-weight:800;font-size:16px;cursor:pointer}.btn.danger{background:#fff0f3;color:#c65d78}.btn.full{width:100%;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:12px 8px;border-bottom:1px solid #eee3e7;text-align:left;vertical-align:middle}th{background:#fcf7f9;color:#715b63}td.right{text-align:right}.empty{text-align:center;color:#aaa;padding:24px}
.summary{display:flex;justify-content:space-between;align-items:end;margin-top:18px}.summary strong{font-size:18px}.big{font-size:30px;font-weight:800;color:#d65a79}
.month-add{display:grid;grid-template-columns:1.2fr .8fr auto;gap:10px;align-items:end;margin-bottom:18px}.month-add label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
.fixed-list{overflow-x:auto}.fixed-list table{min-width:720px}.fixed-list input{padding:10px 9px;font-size:15px;border:2px solid #eee0e5;border-radius:11px;min-width:0}.fixed-list .remain{font-weight:700;white-space:nowrap}.manage{width:105px}.delete-cell{white-space:nowrap}.bottom-summary{margin-top:20px;padding-top:18px;border-top:1px solid #eee3e7}.bottom-summary .line{display:flex;align-items:center;gap:10px;margin:10px 0}.bottom-summary input{max-width:260px}.remain-total{font-size:30px;font-weight:800;margin-top:8px}.note{color:#aaa;font-size:14px;line-height:1.55;margin-top:10px}
@media(max-width:700px){.wrap{padding:12px 12px 40px}header{gap:12px;padding-bottom:18px}.dog{width:74px;height:74px}h1{font-size:25px}.sub{font-size:14px}.tabs{margin:18px 0;gap:8px}.tab{font-size:16px;padding:12px}.card{padding:18px 16px;border-radius:20px}.balance-grid{grid-template-columns:1fr;gap:10px}.balance{min-height:0;padding:18px}.balance h3{font-size:20px}.balance .money{font-size:30px}.form-grid,.entry-row{grid-template-columns:1fr 1fr}.entry-row .wide{grid-column:1/3}.month-add{grid-template-columns:1fr 1fr}.month-add button{grid-column:1/3}.card h2{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <img class="dog" src="dog.png" alt="강아지 사진">
  <div><h1>♡ 윤주아의 가계부 ♡</h1><div class="sub">깔끔하게 한눈에 관리해요</div></div>
</header>

<div class="tabs">
  <button class="tab active" onclick="showPage('ledger',this)">가계부</button>
  <button class="tab" onclick="showPage('monthly',this)">매달 지출</button>
</div>

<section id="ledger" class="page active">
  <div class="balance-grid">
    <div class="balance"><h3>금고</h3><div class="money" id="vaultMoney">0원</div><div class="muted">수입 0원 | 지출 0원</div></div>
    <div class="balance"><h3>현금</h3><div class="money" id="cashMoney">0원</div><div class="muted">수입 0원 | 지출 0원</div></div>
    <div class="balance"><h3>계좌</h3><div class="money" id="bankMoney">0원</div><div class="muted">수입 0원 | 지출 0원</div></div>
  </div>

  <div class="card" style="margin-top:18px">
    <h2>가계부 내역</h2>
    <div class="form-grid">
      <div class="field"><label>날짜</label><input id="date" type="date"></div>
      <div class="field"><label>내용</label><input id="content" placeholder="내용"></div>
      <div class="field"><label>구분</label><select id="account"><option value="cash">현금</option><option value="bank">계좌</option><option value="vault">금고</option></select></div>
    </div>
    <div class="entry-row">
      <div class="field"><label>수입/지출</label><select id="type"><option value="expense">지출</option><option value="income">수입</option></select></div>
      <div class="field wide"><label>사용처</label><input id="place" placeholder="사용처"></div>
      <div class="field"><label>금액</label><input id="entryAmount" type="number" inputmode="numeric" placeholder="금액"></div>
      <button class="btn" onclick="addEntry()">＋ 내역 추가</button>
    </div>
    <div class="fixed-list" style="margin-top:18px">
      <table><thead><tr><th>날짜</th><th>내용</th><th>구분</th><th>수입/지출</th><th>사용처</th><th>금액</th><th>관리</th></tr></thead><tbody id="ledgerList"></tbody></table>
    </div>
  </div>
</section>

<section id="monthly" class="page">
  <div class="card">
    <div class="form-grid">
      <div class="field"><label>총 모아둔 금액</label><input id="saved" type="number" inputmode="numeric"></div>
      <div class="field"><label>총 낸 금액</label><input id="paid" type="number" inputmode="numeric"></div>
      <button class="btn" onclick="saveMoney()">저장</button>
    </div>
    <div class="note">총 모아둔 금액과 총 낸 금액은 직접 숫자로 입력해요. 아래 매달 지출은 각각 따로 수정·추가·삭제할 수 있어요.</div>
  </div>

  <div class="card">
    <h2>매달 지출</h2>
    <div class="month-add">
      <div><label>지출 이름</label><input id="name" placeholder="지출 이름"></div>
      <div><label>금액</label><input id="amount" type="number" inputmode="numeric" placeholder="금액"></div>
      <button class="btn" onclick="addExpense()">＋ 지출 추가</button>
    </div>
    <div class="fixed-list">
      <table>
        <thead><tr><th>지출 이름</th><th>금액</th><th>지출 후 남은 금액</th><th>관리</th><th></th></tr></thead>
        <tbody id="expenseList"></tbody>
      </table>
    </div>
    <div class="bottom-summary">
      <div class="line"><strong>총 낸 금액</strong><input id="paidBottom" type="number" inputmode="numeric"><span>원</span><button class="btn" onclick="saveMoney()">저장</button></div>
      <div><strong>남은 금액</strong> <span class="remain-total" id="remain">0원</span></div>
      <div class="note">※ 괄호 안 자동계산 문구는 넣지 않았어요. 관리 칸도 -1 같은 값 없이 원하는 숫자를 직접 적을 수 있어요.</div>
    </div>
  </div>
</section>
</div>

<script>
const KEY='yoonjua-ledger-final-v1';
const defaults={saved:2700000,paid:1050000,expenses:[
 {name:'월세',amount:750000,manage:750000},{name:'관리비',amount:100000,manage:100000},{name:'통신비',amount:50000,manage:50000},{name:'보험료',amount:150000,manage:150000},{name:'생활비',amount:200000,manage:200000},{name:'강아지용품',amount:80000,manage:80000}],entries:[]};
let data=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(defaults));
const won=n=>Number(n||0).toLocaleString('ko-KR');
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function showPage(id,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');}
function renderMonthly(){
 document.getElementById('saved').value=data.saved||0;document.getElementById('paid').value=data.paid||0;document.getElementById('paidBottom').value=data.paid||0;
 const base=Number(data.saved||0)-Number(data.paid||0);let running=base;
 document.getElementById('expenseList').innerHTML=data.expenses.map((e,i)=>{running-=Number(e.amount||0);return `<tr><td><input value="${esc(e.name)}" onchange="editExpense(${i},'name',this.value)"></td><td><input type="number" inputmode="numeric" value="${Number(e.amount||0)}" onchange="editExpense(${i},'amount',this.value)"></td><td class="remain">${won(running)}원</td><td><input class="manage" type="number" inputmode="numeric" value="${Number(e.manage??e.amount??0)}" onchange="editExpense(${i},'manage',this.value)"></td><td class="delete-cell"><button class="btn danger" onclick="removeExpense(${i})">삭제</button></td></tr>`}).join('')||'<tr><td colspan="5" class="empty">등록된 매달 지출이 없어요.</td></tr>';
 document.getElementById('remain').textContent=won(base-data.expenses.reduce((s,e)=>s+Number(e.amount||0),0))+'원';
}
function saveMoney(){data.saved=Number(document.getElementById('saved').value||0);data.paid=Number(document.getElementById('paid').value||0);save();renderMonthly();}
function addExpense(){const name=document.getElementById('name').value.trim();const amount=Number(document.getElementById('amount').value||0);if(!name||amount<=0){alert('지출 이름과 금액을 입력해주세요.');return}data.expenses.push({name,amount,manage:amount});document.getElementById('name').value='';document.getElementById('amount').value='';save();renderMonthly();}
function editExpense(i,key,value){data.expenses[i][key]=key==='name'?value:Number(value||0);save();renderMonthly();}
function removeExpense(i){if(confirm('이 지출을 삭제할까요?')){data.expenses.splice(i,1);save();renderMonthly();}}
function renderLedger(){
 const sums={vault:{income:0,expense:0},cash:{income:0,expense:0},bank:{income:0,expense:0}};
 data.entries.forEach(e=>sums[e.account][e.type]+=Number(e.amount||0));
 ['vault','cash','bank'].forEach(k=>{document.getElementById(k+'Money').textContent=won(sums[k].income-sums[k].expense)+'원';document.getElementById(k+'Money').nextElementSibling.textContent=`수입 ${won(sums[k].income)}원 | 지출 ${won(sums[k].expense)}원`});
 document.getElementById('ledgerList').innerHTML=data.entries.map((e,i)=>`<tr><td>${esc(e.date)}</td><td>${esc(e.content)}</td><td>${e.account==='cash'?'현금':e.account==='bank'?'계좌':'금고'}</td><td>${e.type==='income'?'수입':'지출'}</td><td>${esc(e.place)}</td><td class="right">${won(e.amount)}원</td><td><button class="btn danger" onclick="removeEntry(${i})">삭제</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">아직 내역이 없어요.</td></tr>';
}
function addEntry(){const date=document.getElementById('date').value||new Date().toISOString().slice(0,10);const content=document.getElementById('content').value.trim();const place=document.getElementById('place').value.trim();const amount=Number(document.getElementById('entryAmount').value||0);if(!content||amount<=0){alert('내용과 금액을 입력해주세요.');return}data.entries.push({date,content,account:document.getElementById('account').value,type:document.getElementById('type').value,place,amount});save();document.getElementById('content').value='';document.getElementById('place').value='';document.getElementById('entryAmount').value='';renderLedger();}
function removeEntry(i){if(confirm('이 내역을 삭제할까요?')){data.entries.splice(i,1);save();renderLedger();}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
document.getElementById('date').value=new Date().toISOString().slice(0,10);renderMonthly();renderLedger();
</script>
</body>
</html>
